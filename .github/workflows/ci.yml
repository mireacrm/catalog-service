# Конвейер сервиса.
#
# Служебный контейнер Postgres поднимается сразу под нужную базу: имя,
# пользователь и пароль совпадают с тем, что тесты берут по умолчанию,
# поэтому отдельный скрипт создания баз здесь не нужен.
#
# Контракты и обвяз ставить отдельно тоже не нужно — они объявлены
# зависимостями с адресом репозитория и приезжают сами.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catalog_user
          POSTGRES_PASSWORD: catalog_pass
          POSTGRES_DB: catalog_db_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalog_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Линтер
        run: |
          pip install ruff
          ruff check .

      - name: Модульные тесты
        run: python -m pytest tests/unit -q

      - name: Интеграционные тесты
        run: python -m pytest tests/integration -q

      - name: Образ собирается
        run: docker build -t catalog-service:ci .

  publish:
    name: Публикация образа
    needs: tests
    # Только с главной ветки: образ с latest обязан соответствовать ей.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/mireacrm/catalog-service
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets-check:
    name: Проверка доступов
    runs-on: ubuntu-latest
    outputs:
      yandex: ${{ steps.check.outputs.yandex }}
    steps:
      - id: check
        # Контекст секретов недоступен в условии работы, поэтому наличие
        # доступов вычисляется шагом и передаётся дальше как результат.
        run: echo "yandex=${{ secrets.YC_KEYS != '' && secrets.YC_REGISTRY_ID != '' }}" >> "$GITHUB_OUTPUT"

  yandex-cloud:
    name: Развёртывание в Яндекс.Облаке
    # Сервис — чистый справочник: отвечает на запросы, не держит соединений
    # с брокером и переживает остановку между вызовами, поэтому именно он
    # уезжает в бессерверный контейнер (ПР7).
    needs: [tests, secrets-check]
    if: github.ref == 'refs/heads/main' && needs.secrets-check.outputs.yandex == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/mirea-crm-catalog

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Вход в реестр
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_KEYS }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Развёртывание бессерверного контейнера
        uses: yc-actions/yc-sls-container-deploy@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_KEYS }}
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          container-name: ${{ secrets.YC_CONTAINER_NAME }}
          revision-image-url: ${{ env.IMAGE }}:${{ github.sha }}
          revision-service-account-id: ${{ secrets.YC_SA_ID }}
          # Бессерверный контейнер останавливается между вызовами и ничего не
          # хранит: база должна быть внешней и доступной из сети.
          revision-env: |
            CATALOG_POSTGRES_DSN=${{ secrets.CATALOG_POSTGRES_DSN }}
            CATALOG_AMQP_URL=${{ secrets.AMQP_URL }}
            CATALOG_HTTP_PORT=8080
